<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payroll – Sheena</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #222; }
  header { background: #2c3e50; color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 18px; margin: 0; }
  header button { background: #fff; color: #2c3e50; border: 0; border-radius: 6px; padding: 6px 12px; font-weight: 600; cursor: pointer; }
  #status { font-size: 12px; padding: 6px 16px; background: #e8f4fd; color: #1b4f72; }
  #status.err { background: #fdecea; color: #a12622; }
  nav { display: flex; background: #fff; border-bottom: 1px solid #ddd; }
  nav button { flex: 1; padding: 12px 0; border: 0; background: none; font-size: 15px; cursor: pointer; color: #666; }
  nav button.active { color: #2c3e50; font-weight: 700; border-bottom: 3px solid #2c3e50; }
  main { padding: 12px; max-width: 720px; margin: 0 auto; }
  .card { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card h2 { font-size: 15px; margin: 0 0 10px; color: #2c3e50; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 6px; text-align: left; border-bottom: 1px solid #eee; }
  th { font-size: 12px; text-transform: uppercase; color: #888; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  .neg { color: #c0392b; }
  .month-head { background: #f8f9fa; font-weight: 700; }
  .month-total td { font-weight: 600; background: #fbfcfd; }
  .tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #eef1f4; color: #555; }
  .hidden { display: none; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 14px; }
  .kv b { color: #2c3e50; }
  .big { font-size: 28px; font-weight: 700; color: #2c3e50; }
  /* receipt */
  .receipt { border: 1px solid #ccc; padding: 20px; background: #fff; }
  .receipt h3 { margin: 0 0 4px; }
  .sig { display: flex; justify-content: space-between; margin-top: 50px; }
  .sig div { width: 45%; border-top: 1px solid #333; padding-top: 6px; font-size: 13px; text-align: center; }
  select { font-size: 15px; padding: 6px; }
  @media print {
    header, nav, #status, .noprint { display: none !important; }
    body { background: #fff; }
    .card { box-shadow: none; }
  }
</style>
</head>
<body>

<header>
  <h1>Payroll</h1>
  <button onclick="load(true)">🔄 Refresh</button>
</header>
<div id="status">Loading…</div>

<nav>
  <button class="active" data-tab="payroll">Payroll</button>
  <button data-tab="receipt">Receipt</button>
  <button data-tab="holidays">Holidays</button>
</nav>

<main>
  <section id="tab-payroll"></section>
  <section id="tab-receipt" class="hidden"></section>
  <section id="tab-holidays" class="hidden"></section>
</main>

<script>
/* =====================================================================
   CONFIG — 如果 helper.html Export 出嚟嘅 data.json 欄位名唔同，
   只需要改呢一段。
   ===================================================================== */
const DATA_URL = 'data.json';
const F = {
  entries:   'entries',        // array of records
  meta:      'meta',           // { lastModified }
  settings:  'settings',       // object below
  employer:  'employer',
  worker:    'worker',
  salary:    'salary',         // current monthly salary (number)
  start:     'contractStart',  // YYYY-MM-DD
  end:       'contractEnd',    // YYYY-MM-DD
  leaveTaken:'leaveTaken',     // number
  leaveTotal:'leaveTotal',     // number (two-year total, default 14)
  // entry fields
  id: 'id', date: 'date', cat: 'category', amt: 'amount', note: 'note'
};
const DAYS_PER_MONTH = 30.4375;

const CAT_LABEL = {
  salary: 'Salary', buyout: 'Holiday Buyout', sh: 'Statutory Holiday',
  bonus: 'Bonus', advance: 'Advance', deduction: 'Deduction', other: 'Other'
};
const SUBTRACT = new Set(['advance', 'deduction']);

/* 2026 法定假期 — 勞工處官方 (15 日) */
const STAT_HOLIDAYS = {
  2026: [
    ['2026-01-01', "New Year's Day"],
    ['2026-02-17', "Lunar New Year's Day"],
    ['2026-02-18', 'Second day of Lunar New Year'],
    ['2026-02-19', 'Third day of Lunar New Year'],
    ['2026-04-05', 'Ching Ming Festival'],
    ['2026-04-06', 'Easter Monday (new from 2026)'],
    ['2026-05-01', 'Labour Day'],
    ['2026-05-24', 'Birthday of the Buddha'],
    ['2026-06-19', 'Tuen Ng Festival'],
    ['2026-07-01', 'HKSAR Establishment Day'],
    ['2026-09-26', 'Day after Mid-Autumn Festival'],
    ['2026-10-01', 'National Day'],
    ['2026-10-18', 'Chung Yeung Festival'],
    ['2026-12-25', 'Christmas Day (or 22 Dec Winter Solstice, employer\'s option)'],
    ['2026-12-26', 'First weekday after Christmas']
  ]
  // 其他年份：由 helper.html 抄過嚟
};

/* ===================================================================== */
let D = null;   // loaded data

const $ = s => document.querySelector(s);
const fmt = n => '$' + Math.round(n).toLocaleString('en-HK');
const fmtDate = s => { const d = new Date(s); return isNaN(d) ? s : d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }); };
const ym = s => s.slice(0, 7);
const ymLabel = s => new Date(s + '-01').toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function get(o, k, d) { return (o && o[k] !== undefined && o[k] !== null) ? o[k] : d; }
function entries() { return (get(D, F.entries, []) || []).slice().sort((a, b) => a[F.date] < b[F.date] ? 1 : -1); }
function settings() { return get(D, F.settings, {}); }
function dailyRate(salary) { return Math.round(salary / DAYS_PER_MONTH); }

/* ---------- load ---------- */
async function load(manual) {
  const st = $('#status');
  st.className = ''; st.textContent = 'Loading…';
  try {
    const r = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    D = await r.json();
    const lm = get(get(D, F.meta, {}), 'lastModified', null);
    st.textContent = 'Last updated: ' + (lm ? new Date(lm).toLocaleString('en-GB') : 'unknown');
    renderAll();
  } catch (e) {
    st.className = 'err';
    st.textContent = '暫時未能載入 / Unable to load data. ' + (manual ? 'Please try again later.' : 'Tap Refresh to retry.');
    if (!D) ['payroll', 'receipt', 'holidays'].forEach(t => $('#tab-' + t).innerHTML = '');
  }
}

/* ---------- tabs ---------- */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x === b));
  ['payroll', 'receipt', 'holidays'].forEach(t => $('#tab-' + t).classList.toggle('hidden', t !== b.dataset.tab));
});

/* ---------- totals ---------- */
function monthTotals(list) {
  let earned = 0, advance = 0;
  for (const e of list) {
    const a = Number(e[F.amt]) || 0, c = e[F.cat];
    if (c === 'advance') advance += a;
    else if (c === 'deduction') earned -= a;
    else earned += a;
  }
  return { earned, advance, net: earned - advance };
}

/* ---------- Payroll tab ---------- */
function renderPayroll() {
  const list = entries();
  if (!list.length) { $('#tab-payroll').innerHTML = '<div class="card">No records.</div>'; return; }

  // group by month
  const byMonth = {};
  for (const e of list) (byMonth[ym(e[F.date])] ||= []).push(e);
  const months = Object.keys(byMonth).sort().reverse();

  // yearly summary
  const byYear = {};
  for (const m of months) {
    const y = m.slice(0, 4), t = monthTotals(byMonth[m]);
    const Y = byYear[y] ||= { earned: 0, advance: 0, net: 0 };
    Y.earned += t.earned; Y.advance += t.advance; Y.net += t.net;
  }

  let h = `<div class="card"><h2>Yearly Summary</h2><table>
    <tr><th>Year</th><th class="num">Earned</th><th class="num">Advance</th><th class="num">Net</th></tr>`;
  for (const y of Object.keys(byYear).sort().reverse()) {
    const t = byYear[y];
    h += `<tr><td>${y}</td><td class="num">${fmt(t.earned)}</td><td class="num neg">${t.advance ? '−' + fmt(t.advance) : '–'}</td><td class="num"><b>${fmt(t.net)}</b></td></tr>`;
  }
  h += `</table></div>`;

  h += `<div class="card"><h2>All Records</h2><table>`;
  for (const m of months) {
    const t = monthTotals(byMonth[m]);
    h += `<tr class="month-head"><td colspan="3">${ymLabel(m)}</td></tr>`;
    for (const e of byMonth[m].sort((a, b) => a[F.date] < b[F.date] ? 1 : -1)) {
      const neg = SUBTRACT.has(e[F.cat]);
      h += `<tr>
        <td style="white-space:nowrap">${fmtDate(e[F.date])}</td>
        <td><span class="tag">${CAT_LABEL[e[F.cat]] || esc(e[F.cat])}</span> ${esc(e[F.note])}</td>
        <td class="num ${neg ? 'neg' : ''}">${neg ? '−' : ''}${fmt(e[F.amt])}</td></tr>`;
    }
    h += `<tr class="month-total"><td></td><td>Earned ${fmt(t.earned)}${t.advance ? ` · Advance −${fmt(t.advance)}` : ''}</td><td class="num">Net ${fmt(t.net)}</td></tr>`;
  }
  h += `</table></div>`;
  $('#tab-payroll').innerHTML = h;
}

/* ---------- Receipt tab ---------- */
function renderReceipt() {
  const list = entries();
  const months = [...new Set(list.map(e => ym(e[F.date])))].sort().reverse();
  if (!months.length) { $('#tab-receipt').innerHTML = '<div class="card">No records.</div>'; return; }
  const sel = $('#receipt-month') ? $('#receipt-month').value : months[0];
  const m = months.includes(sel) ? sel : months[0];
  const rows = list.filter(e => ym(e[F.date]) === m && e[F.cat] !== 'advance').sort((a, b) => a[F.date] < b[F.date] ? -1 : 1);
  const t = monthTotals(list.filter(e => ym(e[F.date]) === m));
  const s = settings();

  let h = `<div class="card noprint" style="display:flex;gap:10px;align-items:center;justify-content:space-between">
    <label>Month <select id="receipt-month" onchange="renderReceipt()">${months.map(x => `<option value="${x}" ${x === m ? 'selected' : ''}>${ymLabel(x)}</option>`).join('')}</select></label>
    <button onclick="print()">🖨 Print</button></div>`;

  h += `<div class="card receipt">
    <h3>Salary Receipt — ${ymLabel(m)}</h3>
    <div style="font-size:13px;color:#555;margin-bottom:12px">Employer: <b>${esc(get(s, F.employer, ''))}</b> &nbsp;·&nbsp; Helper: <b>${esc(get(s, F.worker, ''))}</b></div>
    <table>`;
  for (const e of rows) {
    const neg = e[F.cat] === 'deduction';
    h += `<tr><td>${fmtDate(e[F.date])}</td><td>${CAT_LABEL[e[F.cat]] || esc(e[F.cat])} ${esc(e[F.note])}</td><td class="num ${neg ? 'neg' : ''}">${neg ? '−' : ''}${fmt(e[F.amt])}</td></tr>`;
  }
  h += `<tr class="month-total"><td colspan="2">Total Earned</td><td class="num">${fmt(t.earned)}</td></tr>`;
  if (t.advance) h += `<tr><td colspan="2">Less: Advance received</td><td class="num neg">−${fmt(t.advance)}</td></tr>`;
  h += `<tr class="month-total"><td colspan="2"><b>Net Paid</b></td><td class="num"><b>${fmt(t.net)}</b></td></tr></table>
    <div class="sig"><div>Employer</div><div>Helper</div></div>
    </div>`;
  $('#tab-receipt').innerHTML = h;
}

/* ---------- Holidays tab ---------- */
function renderHolidays() {
  const s = settings();
  const start = new Date(get(s, F.start, '')), end = new Date(get(s, F.end, ''));
  const taken = Number(get(s, F.leaveTaken, 0)) || 0;
  const total = Number(get(s, F.leaveTotal, 14)) || 14;
  const salary = Number(get(s, F.salary, 0)) || 0;
  const today = new Date(); today.setHours(0, 0, 0, 0);

  let h = '';
  if (!isNaN(start) && !isNaN(end)) {
    const DAY = 86400000;
    const totalDays = Math.round((end - start) / DAY) + 1;
    const passed = Math.min(Math.max(Math.round((today - start) / DAY) + 1, 0), totalDays);
    const accrued = passed * total / totalDays;
    const balance = accrued - taken;
    h += `<div class="card"><h2>Annual Leave</h2>
      <div class="big">${balance.toFixed(1)} <span style="font-size:14px;font-weight:400;color:#666">days available</span></div>
      <div class="kv" style="margin-top:10px">
        <span>Contract</span><b>${fmtDate(get(s, F.start))} → ${fmtDate(get(s, F.end))}</b>
        <span>Days passed</span><b>${passed} / ${totalDays}</b>
        <span>Accrued so far</span><b>${accrued.toFixed(1)} of ${total}</b>
        <span>Leave taken</span><b>${taken}</b>
        ${salary ? `<span>Daily rate</span><b>${fmt(dailyRate(salary))} <span style="color:#888;font-weight:400">(${fmt(salary)} ÷ ${DAYS_PER_MONTH})</span></b>` : ''}
      </div></div>`;
  } else {
    h += `<div class="card">Contract dates not available.</div>`;
  }

  for (const y of Object.keys(STAT_HOLIDAYS).sort()) {
    h += `<div class="card"><h2>Statutory Holidays ${y}</h2><table>`;
    for (const [d, n] of STAT_HOLIDAYS[y]) {
      const past = new Date(d) < today;
      h += `<tr style="${past ? 'color:#999' : ''}"><td style="white-space:nowrap">${fmtDate(d)}</td><td>${n}</td></tr>`;
    }
    h += `</table></div>`;
  }
  $('#tab-holidays').innerHTML = h;
}

function renderAll() { renderPayroll(); renderReceipt(); renderHolidays(); }

/* ---------- auto refresh when returning to the page ---------- */
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(false); });
load(false);
</script>
</body>
</html>
